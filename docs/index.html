<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nemorix — Virtual Memory for AI Agents</title>
  <meta name="description" content="CXL-aware KV-cache tiering that treats agent memory like an OS memory hierarchy. 49× faster, 97% cheaper." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>" />

  <!-- Docsify theme -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.min.css" />

  <style>
    :root {
      --theme-color: #7c3aed;
      --text-color-base: #1a1a2e;
      --text-color-secondary: #4a4a6a;
      --sidebar-background: #0f0f23;
      --sidebar-nav-link-color: #c4b5fd;
      --sidebar-nav-link-color--active: #a78bfa;
      --sidebar-nav-link-background-color--active: rgba(124, 58, 237, 0.15);
      --sidebar-width: 260px;
      --base-font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --base-font-size: 15px;
      --heading-color: #1a1a2e;
      --code-theme-background: #1e1e3f;
      --code-theme-text: #d4d4f5;
      --cover-background-color: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    }

    /* Cover page */
    section.cover {
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%) !important;
    }

    section.cover .cover-main > p:first-child img {
      max-width: 80px;
    }

    /* Sidebar */
    .sidebar {
      background: #0f0f23;
      border-right: 1px solid rgba(124, 58, 237, 0.2);
    }

    .sidebar .app-name-link {
      color: #a78bfa !important;
      font-weight: 700;
      font-size: 1.2rem;
    }

    .sidebar-nav a {
      color: #9ca3af !important;
    }

    .sidebar-nav a.active,
    .sidebar-nav a:hover {
      color: #c4b5fd !important;
    }

    /* Content */
    .markdown-section h1 {
      color: #7c3aed;
    }

    .markdown-section h2 {
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 0.5rem;
    }

    /* Tip / info alerts */
    .tip {
      background: rgba(124, 58, 237, 0.07);
      border-left: 4px solid #7c3aed;
      color: #1a1a2e;
    }

    /* Badge-style numbers in tables */
    .markdown-section table td:first-child {
      font-weight: 500;
    }

    /* Code blocks */
    .markdown-section pre {
      border-radius: 8px;
    }

    /* Nav bar */
    .app-nav {
      margin-top: 12px;
    }

    /* Search */
    .search input {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(124,58,237,0.3);
      color: #c4b5fd;
      border-radius: 6px;
    }

    .search input::placeholder {
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div id="app">Loading Nemorix docs…</div>

  <script>
    window.$docsify = {
      name: '🧠 Nemorix',
      repo: 'https://github.com/your-org/nemorix',      // update with your repo URL
      logo: '',
      loadNavbar: true,
      loadSidebar: true,
      subMaxLevel: 3,
      auto2top: true,
      relativePath: true,
      coverpage: true,
      onlyCover: false,
      themeColor: '#7c3aed',
      search: {
        depth: 3,
        noData: 'No results found.',
        placeholder: 'Search docs…',
      },
      copyCode: {
        buttonText: 'Copy',
        errorText: 'Error',
        successText: 'Copied!',
      },
      pagination: {
        previousText: '← Previous',
        nextText: 'Next →',
        crossChapter: true,
      },
      tabs: {
        persist: true,
        sync: true,
      },
    };
  </script>

  <!-- Docsify core -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- Plugins -->
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
  <!-- Syntax highlighting -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
